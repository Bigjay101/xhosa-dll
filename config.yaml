# Project configuration (handbook D6.2). All paths are relative to the repository root.
# With --smoke, the data/results paths are redirected to data/smoke/<name>.
seed: 13

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  conditions: data/conditions
  smoke: data/smoke
  results: results
  scores: results/scores
  figures: figures
  logs: logs

historical:
  sources: {isigidimi: isigidimi, imvo: imvo}               # sub-folders of paths.raw
  expected_words: {isigidimi: 1619386, imvo: 5473187}       # Schoots et al. 2023
  expected_editions: {isigidimi: 202, imvo: 518}            # Schoots et al. 2023
  expected_english_share: {isigidimi: 0.012, imvo: 0.272}   # Schoots et al. 2023
  year_range: [1870, 1894]
  first_year: {isigidimi: 1870, imvo: 1884}
  last_year: {isigidimi: 1888, imvo: 1894}

clean: {min_block_words: 3, block_merge_if_median_below: 15}
dedup: {minhash_threshold: 0.8, shingle: 5, num_perm: 128, exact_only_below_words: 10}
langid: {p_eng_threshold: 0.5, glotlid_repo: cis-lmu/glotlid, glotlid_file: model.bin,
         english_wordlist_size: 2000, block_words: 40}
segment: {chunk_words: 32}
split: {fractions: {train: 0.6, dev: 0.2, test: 0.2}, seed: 13}
sample: {dev_per_source: 300, test_per_source: 1000, max_per_edition: 20,
         max_per_modern_doc: 5, depth_per_source: 500}

modern:
  vuk: {hf_id: dsfsi/vukuzenzele-monolingual, config: xho, eng_config: eng, text_field: auto}
  mzansi: {hf_id: anrilombard/mzansi-text, lang_value: CHECK, max_rows: 200000}

lexicon: {min_freq: 2}

tokenizers: [FacebookAI/xlm-roberta-base, Davlan/afro-xlmr-base,
             anrilombard/mzansilm-125m, facebook/nllb-200-distilled-600M]
models: {xlmr: FacebookAI/xlm-roberta-base, afro: Davlan/afro-xlmr-base,
         mzansi: anrilombard/mzansilm-125m}
scoring: {method: l2r, batch_size: 64, dtype: float32, max_tokens: 512}

rules: {min_oov_freq: 5, max_edit_distance: 2, min_support: 20, max_edits_per_word: 2,
        include_other: false, anchors: 2000, context_window: 2, validity_boot: 2000}
interventions: {doses: [0.25, 0.5, 1.0]}
stats: {n_boot: 10000, n_perm: 10000, ci: 0.95, alpha: 0.05}
